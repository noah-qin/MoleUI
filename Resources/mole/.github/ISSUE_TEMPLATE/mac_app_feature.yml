name: Mac App Feature
description: Suggest an improvement for the paid Mole Mac app.
title: "[Mac App Feature] "
labels: ["mac-app", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement for the Mole Mac app.

        First update to the latest stable release from https://mole.fit, quit and reopen Mole, and check whether the feature is already available.

        The Mole Mac app is a paid native app. Its source code is not public. This repository hosts the open-source Mole CLI and public feedback for the Mac app.

        Please keep requests concrete: what workflow is hard today, what you expected Mole to do, and why it matters.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Clean
        - Uninstall
        - Optimize
        - Analyze
        - Status
        - Activation / license
        - Onboarding / permissions
        - Website / help
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "When I use Mole, I want to..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Mole to do?
      placeholder: "A good solution could be..."
    validations:
      required: true
  - type: textarea
    id: current_workaround
    attributes:
      label: Current workaround
      placeholder: "Today I work around it by..."
    validations:
      required: false
  - type: textarea
    id: examples
    attributes:
      label: Examples, screenshots, or references
      description: Give one concrete example, such as an app, a folder (with your username removed), or the steps you take today. Screenshots and links can help.
      placeholder: "Which app, folder, or workflow would this improve?"
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I updated to the latest stable Mole Mac app, reopened it, and checked that this feature is still missing.
          required: true
        - label: This request is for the Mole Mac app, not the Mole CLI.
          required: true
        - label: I did not include license keys, order numbers, or private data.
          required: true
