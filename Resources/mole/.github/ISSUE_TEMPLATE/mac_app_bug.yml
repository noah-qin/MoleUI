name: Mac App Bug
description: Report a bug in the paid Mole Mac app.
title: "[Mac App Bug] "
labels: ["mac-app", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Mole Mac app bug.

        First update to the latest stable release from https://mole.fit, quit and reopen Mole, and reproduce the problem. Check About Mole for the version actually running. If updating itself fails, report that failure with your installed version.

        The Mole Mac app is a paid native app. Its source code is not public. This repository hosts the open-source Mole CLI and public feedback for the Mac app.

        Do not include license keys, order numbers, private paths, or logs with personal data. For payment, refund, license, or security issues, email hi@mole.fit instead.
  - type: input
    id: app_version
    attributes:
      label: Mole Mac app version
      description: After updating and reopening Mole, verify the prefilled version and build against About Mole; replace it if it is stale.
      placeholder: "Version (build), or version from About Mole"
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS version
      placeholder: "macOS 15.5"
    validations:
      required: true
  - type: input
    id: mac_model
    attributes:
      label: Mac model
      placeholder: "MacBook Pro M3 Pro, Mac mini M2, etc."
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Full Disk Access / permissions
        - Clean
        - Uninstall
        - Optimize
        - Analyze
        - Status
        - Activation / license
        - Download / update
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what went wrong. For app detection, updates, or uninstall issues, include the affected app’s name, version, and install source (website, App Store, or Homebrew). For cleanup issues, include the relevant folder with your username removed.
      placeholder: "Mole did..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Mole
        2. Go to ...
        3. Click ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "I expected Mole to..."
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or safe logs
      description: Attach screenshots or paste logs only after removing private paths, license keys, and order details.
      placeholder: "Drag screenshots here, or paste safe logs."
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I updated to the latest stable Mole Mac app, reopened it, and reproduced this problem (or this report explains why I cannot update).
          required: true
        - label: I did not include license keys, order numbers, or private data.
          required: true
